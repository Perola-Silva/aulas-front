<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seletores Modernos</title>
    <style>
        *,*::before,*::after {
        box-sizing: border-box;
        }

        :root {
            --cor-borda: rgb(245, 82, 109);
            --cor-destaque:rgb(255, 0, 140);
        }

        body {
            font-family: cursive;
            padding: 2rem;
            background-color: rgb(255, 221, 238);
        }

        article {
            background-color: rgb(238, 161, 180);
            border: solid 2px palevioletred;
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 400px;
            margin-inline: auto;
            margin-block: 2rem;
        }

        img {
            max-width: 100%;
            border-radius: 10px;
        }

        a {
            text-decoration: none;
            background-color: var(--cor-destaque);
            color: white;
            padding: 0.5rem;
            border-radius: 10px;
        }

        article :is(h2, p, span) {
            /* Agrupamos dentro do contexto do article usando pseudo-classes :is() e formatamos os elemtos ali contidos */
            color: rgb(255, 239, 239);
        }

        article:has(img){
            /* Usamos o :has() para, atraves de uma condição baseada non filho, conseguir formatar o pai. */
            border-color: rgb(16, 13, 70);
            background-color: rgb(56, 155, 150);
        }

        article:has(a:hover){
            /* aplica sombra no artigo, desde que passe o mouse no link dentro dele */
            box-shadow: black 0 0 10px;
        }
    </style>

</head>
<body>
    <h1>Usando seletores <code>:is</code> e <code>:has</code></h1>

    <article>
        <h2>Exemplo 1</h2>
        <p>Aqui temos um texto qualquer</p>
        <span>Aqui outro texto...</span>
    </article>

    <article>
        <img src="imagens/front-end.jpg" alt="">
        <h2>Exemplo 2: Artigo com imagem</h2>
        <p>Aqui temos imagem e texto</p>
    </article>

    <article>
        <h2>Exemplo 3: Texto com link</h2>
        <p>Texto qualquer...</p>
        <a href="">Link qualquer</a>
    </article>

    <hr>
    <h2>Outro titulo...</h2>
    <p>Outro texto...</p>
    <span>Outro texto do span...</span>
</body>

</html>
