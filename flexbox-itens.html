<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Itens</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: aliceblue;
            padding: 1rem;
        }

        h1 {
            font-size: 1.2rem;
            margin-block-end: 0.8rem;
        }

        /* Flex Container */
        .container {
            background-color: rgb(164, 171, 179);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
            margin-block: 10px;
        }

        /* Flex Items */
        .item {
            background-color: rgb(200, 207, 212);
            padding: 20px;
            text-align: center;

            /* Tamanho ideal para o flex */
            flex-basis: 150px;

            /* Definindo se o item cresce */
            flex-grow: 1;

            /* Definindo se o Item encolhe */
            flex-shrink: 1;
        }

        .d {
            background-color: pink;
            /* Grow com outro valores define a proporção do crescimento */
            flex-grow: 3;
        }

        .e {
            background-color: palevioletred;
            /* Shrink com outro valores define a proporção do crescimento */
            flex-shrink: 2;
        }

        .f {
            background-color: violet;
            /* Quando zerados, fixam o tamanho do elemento */
            flex-grow: 0;
            flex-shrink: 0;
        }

        .g {
            background-color: aqua;
            order: 3;
        }

        .h {
            background-color: blueviolet;
            order: 1;
            align-self: center;
        }

        .i {
            background-color: brown;
            order: 2;
            align-self: flex-end;
        }

        .alinhamentos {
            height: 300px;
            align-items: flex-start;

        }
    </style>
</head>
<body>
    <h1>Conhecendo e experimentando propriedades flex para os itens de um container</h1>

    <div class="container">
        <div class="item a">Item A</div>
        <div class="item b">Item B</div>
        <div class="item c">Item C</div>
    </div>

    <div class="container">
        <div class="item d">Item D</div>
        <div class="item e">Item E</div>
        <div class="item f">Item F</div>
    </div>

    <div class="container alinhamentos">
        <div class="item g">Item G</div>
        <div class="item h">Item H</div>
        <div class="item i">Item I</div>
    </div>
</body>
</html>
