<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicío Flexbox</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, h1, h2, p {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        header {
            background-color: rgb(164, 237, 255);
            display: flex;
            align-items: center;
            height: auto;
            padding: 50px;
            justify-content: space-around;

            nav {
                display: flex;
                justify-content: space-around;
                background-color: rgb(238, 229, 149);
                padding: 10px;
                width: 60%;
                flex-wrap: wrap;
                border-radius: 10px;

                a{
                    text-decoration: none;
                    margin-inline: 5px;
                    font-weight: bold;
                    color: black;
                }
            }
        }

        main {
            margin-block: 2rem;
            display: flex;
            align-items: flex-start;
            justify-content: space-evenly;
            gap: 1.2rem;
            height: 100px;
            flex-wrap: wrap;
            align-content: flex-start;
        }

        article {
            border: solid black 0.5px;
            height: 140px;
            width: 250px;
            padding: 1rem;
        }


    </style>
</head>

<body>

    <header>
        <h1>Exercicío Flexbox</h1>

            <nav>
                <a href="">Início</a>
                <a href="">Notícias</a>
                <a href="">Cursos</a>
                <a href="">Contato</a>
            </nav>
    </header>

    <main>
        <article>
            <h2>Nova IA no mercado</h2>
            <p>Tecnologia promete revolucionar o setor.</p>
        </article>

        <article>
            <h2>CSS moderno</h2>
            <p>Novos recursos chegam aos navegadores.</p>
        </article>


        <article>
            <h2>JavaScript 2026</h2>
            <p>Atualizações e melhores práticas.</p>
        </article>


        <article>
            <h2>Frameworks em alta</h2>
            <p>Quais tecnologias dominarão o mercado.</p>
        </article>
    </main>
</body>

</html>
