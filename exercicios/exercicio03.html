<body>
    <h1>Pinturas a óleo em tela🖌️</h1>
    <hr>
    <p>Pinturas a óleo são muito aclamadas no meio artistico pela vibrancia das cores e sua capacidade de transição de
        cores e mistura suave, além do seu ar de renascentismo por ter sido tão marcante nessa epoca</p>

    <figure>
        <img src="pinturas-exercicio03/europeana-pintada1-unsplash.jpg"
            alt="Arranjo de flores pintados com tinta a óleo" height="850" width="640">
        <figcaption>Neste trabalho podemos observar como o artista consegue alcançar tons sobrios e os harmonizar de
            forma uniforme em cada petala do arranjo</figcaption>
    </figure>
    <hr>

    <figure><img src="pinturas-exercicio03/europeana-pintada2-unsplash.jpg"
            alt="Arranjo de flores com cores vivas dentro de um vaso de vidro, com outros elementos como frutas e borboletas sob as petalas pintadas com tinta a óleo"
            height="911" width="640">
        <figcaption>Neste trabalho vemos como o óleo pode alcancar cores vibrantes sem sacrificar sua capacidade de
            mistura pelo modo como as transições das sombras e luzes conseguem ficar sutis</figcaption>
    </figure>
    <hr>

    <figure><img src="pinturas-exercicio03/europeana-pintada3-unsplash.jpg"
            alt="Arranjo de frutas contendo uvas, pessegos, goiabas e algumas flores pintada a tinta a óleo"
            height="505" width="640">
        <figcaption>Vemos a mistura de ambos os mundos nesta obra, o modo como o artista misturou tons vivos e sombrios
            para formar uma obra coesa que mostra perfeitamente o motivo pelo qual pinturas renascentistas são tão
            iconicas e memoraveis</figcaption>
    </figure>
